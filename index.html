<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLO PROJECT — 나는 연애할 때 어떤 사람일까?</title>

  <!-- 링크 복사/공유 시 미리보기 카드에 쓰이는 메타태그 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SOLO PROJECT — 나는 연애할 때 어떤 사람일까?" />
  <meta property="og:description" content="10가지 상황으로 알아보는 나의 행동성 × 감정표현 스타일, 9가지 SOLO TYPE" />
  <meta property="og:image" content="https://soloproject10test.netlify.app/share-card.png" />
  <meta property="og:url" content="https://soloproject10test.netlify.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SOLO PROJECT — 나는 연애할 때 어떤 사람일까?" />
  <meta name="twitter:description" content="10가지 상황으로 알아보는 나의 행동성 × 감정표현 스타일, 9가지 SOLO TYPE" />
  <meta name="twitter:image" content="https://soloproject10test.netlify.app/share-card.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">

    <!-- ===================== LANDING ===================== -->
    <section id="landing" class="screen active">
      <div class="landing-inner">
        <svg class="doodle" style="top:6px;left:6px;" width="26" height="26" viewBox="0 0 26 26"><path d="M13 2 L15.5 10 L24 13 L15.5 16 L13 24 L10.5 16 L2 13 L10.5 10 Z" fill="#FFC857" stroke="#3B2440" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg class="doodle" style="top:40px;right:10px;" width="20" height="20" viewBox="0 0 20 20"><path d="M10 17 C3 12 1 7 5 4 C7.5 2.3 10 4 10 6.5 C10 4 12.5 2.3 15 4 C19 7 17 12 10 17 Z" fill="#FF6F59" stroke="#3B2340" stroke-width="1.4"/></svg>
        <svg class="doodle" style="bottom:120px;left:4px;" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="#D85A30"/></svg>
        <svg class="doodle" style="bottom:96px;right:8px;" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2" fill="#FF6F59"/></svg>

        <div class="eyebrow">SOLO PROJECT</div>
        <h1 class="headline">나는 연애할 때<br><span>어떤 사람일까?</span></h1>
        <p class="subcopy">10가지 상황으로 알아보는<br>나의 행동성 × 감정표현 스타일</p>

        <div class="mascot-wrap">
          <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="돋보기를 든 몽글이 캐릭터">
            <ellipse cx="75" cy="128" rx="34" ry="6" fill="#3B2340" opacity="0.12"/>
            <path d="M75 118 C40 95 22 68 30 45 C36 27 58 22 75 42 C92 22 114 27 120 45 C128 68 110 95 75 118 Z"
                  fill="#FFD8C2" stroke="#3B2340" stroke-width="3.5" stroke-linejoin="round"/>
            <ellipse cx="52" cy="68" rx="9" ry="6" fill="#FF9B84" opacity="0.7"/>
            <ellipse cx="98" cy="68" rx="9" ry="6" fill="#FF9B84" opacity="0.7"/>
            <circle cx="58" cy="58" r="4.5" fill="#3B2340"/>
            <circle cx="92" cy="58" r="4.5" fill="#3B2340"/>
            <circle cx="59.5" cy="56.5" r="1.3" fill="#fff"/>
            <circle cx="93.5" cy="56.5" r="1.3" fill="#fff"/>
            <path d="M63 72 Q75 80 87 72" stroke="#3B2340" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M100 80 Q118 82 122 68" stroke="#3B2340" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <circle cx="128" cy="55" r="13" fill="#FFF7EE" stroke="#3B2340" stroke-width="3.5"/>
            <line x1="137" y1="65" x2="146" y2="75" stroke="#3B2340" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M50 80 Q34 84 30 96" stroke="#3B2340" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="badges"><span class="badge">10문항</span><span class="badge">약 1분</span><span class="badge">9가지 유형</span></div>

        <button class="cta" id="startBtn">무료 테스트 시작</button>
        <p class="privacy">응답은 익명 통계 목적으로만 수집돼요</p>
      </div>
    </section>

    <!-- ===================== QUIZ ===================== -->
    <section id="quiz" class="screen">
      <div class="quiz-inner">
        <div class="quiz-top">
          <button class="back-btn" id="backBtn" aria-label="이전 문항">←</button>
          <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
          <div id="progressText" class="progress-num">1 / 10</div>
        </div>

        <div class="quiz-mascot-row">
          <svg width="86" height="80" viewBox="0 0 120 110" role="img" aria-label="생각하는 몽글이 캐릭터">
            <path d="M60 98 C30 78 16 55 24 36 C29 21 48 17 60 34 C72 17 91 21 96 36 C104 55 90 78 60 98 Z"
                  fill="#FFD8C2" stroke="#3B2340" stroke-width="3" stroke-linejoin="round"/>
            <ellipse cx="42" cy="55" rx="7" ry="5" fill="#FF9B84" opacity="0.75"/>
            <ellipse cx="78" cy="55" rx="7" ry="5" fill="#FF9B84" opacity="0.75"/>
            <circle cx="46" cy="48" r="3.6" fill="#3B2340"/>
            <circle cx="74" cy="48" r="3.6" fill="#3B2340"/>
            <path d="M52 63 Q60 60 68 63" stroke="#3B2340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M76 66 Q84 70 80 78" stroke="#3B2340" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="98" cy="30" r="3" fill="#3B2340" opacity="0.5"/>
            <circle cx="106" cy="20" r="2.2" fill="#3B2340" opacity="0.4"/>
          </svg>
        </div>

        <div id="axisPill" class="axis-pill"></div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="choices" class="choice-list"></div>
      </div>
    </section>

    <!-- ===================== RESULT ===================== -->
    <section id="result" class="screen">
      <div class="result-inner">
        <div class="result-eyebrow">나의 SOLO TYPE</div>
        <div id="resultType" class="result-type"></div>

        <div class="result-mascot-row" id="resultMascot"></div>

        <p id="resultDefinition" class="result-definition"></p>

        <div class="score-row">
          <div class="score-box"><span class="lab">행동성</span><strong id="xLabel"></strong><em id="xScore"></em></div>
          <div class="score-box"><span class="lab">감정표현</span><strong id="yLabel"></strong><em id="yScore"></em></div>
        </div>

        <div class="section-title">너 이런 편</div>
        <ul id="traits" class="traits"></ul>

        <div class="section-title">조금 뜨끔할 수도</div>
        <div id="sting" class="sting-box"></div>

        <div class="section-title">연애 강점</div>
        <p id="strength" class="strength-text"></p>

        <div class="share-card" id="shareCard">
          <div class="share-mascot" id="shareMascot"></div>
          <div class="share-text">
            <div class="share-brand">SOLO PROJECT</div>
            <div id="shareType" class="share-type"></div>
            <div id="shareLine" class="share-line"></div>
          </div>
        </div>

        <div class="share-grid">
          <button class="chan-btn" id="kakaoBtn"><span class="chan-badge chan-kakao">톡</span>카카오톡</button>
          <button class="chan-btn" id="instaBtn"><span class="chan-badge chan-insta">IG</span>인스타그램</button>
          <button class="chan-btn" id="threadsBtn"><span class="chan-badge chan-threads">@</span>스레드</button>
          <button class="chan-btn" id="bandBtn"><span class="chan-badge chan-band">밴드</span>밴드</button>
          <button class="chan-btn" id="copyBtn"><span class="chan-badge chan-copy">🔗</span>링크 복사</button>
        </div>
        <button class="ghost-wide" id="restartBtn">다시 테스트하기</button>

        <div class="paid-tease">
          <span>COMING NEXT</span>
          <h3>이 결과, 더 깊게 보고 싶다면?</h3>
          <p>나의 연애 패턴 심층진단 · 그 사람과 나의 카톡 분석</p>
        </div>
      </div>
    </section>

  </main>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
